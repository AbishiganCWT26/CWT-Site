<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animated Laptop Mockup</title>
    <style>
        :root {
            --accent: #d9534f;
            --w: min(900px, 88vw);
            /* laptop width – change this only */
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        /* transparent page background */
        html,
        body {
            background: transparent;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            padding: 80px 0
        }

        .stage {
            width: var(--w);
            perspective: 1800px;
            animation: float 6s ease-in-out infinite
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-10px)
            }
        }

        /* ---------- LID ---------- */
        .lid {
            position: relative;
            aspect-ratio: 16/10;
            background: #1b1b1f;
            border-radius: 16px 16px 0 0;
            padding: 2.2% 2.2% 3%;
            border: 2px solid #3a3a41;
            transform-origin: 50% 100%;
            transform: rotateX(-92deg);
            /* closed */
            transition: transform 1.4s cubic-bezier(.2, .8, .2, 1);
            box-shadow: 0 -2px 30px rgba(0, 0, 0, .15);
        }

        .stage.open .lid {
            transform: rotateX(0)
        }

        .lid::before {
            /* camera */
            content: "";
            position: absolute;
            top: 1.1%;
            left: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #33343b;
            transform: translateX(-50%)
        }

        /* ---------- SCREEN ---------- */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            border-radius: 4px
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 1s ease, transform 6s ease-out
        }

        .slide.active {
            opacity: 1;
            transform: scale(1)
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block
        }

        /* glossy reflection */
        .screen::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(115deg, rgba(255, 255, 255, .14) 0%, transparent 35%)
        }

        /* indicators */
        .dots {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5
        }

        .dots button {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, .3);
            background: rgba(255, 255, 255, .7);
            padding: 0;
            transition: transform .3s, background .3s
        }

        .dots button.active {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.35)
        }

        /* progress bar */
        .bar {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            background: var(--accent);
            width: 0;
            z-index: 5
        }

        .bar.run {
            animation: fill var(--dur, 4s) linear forwards
        }

        @keyframes fill {
            to {
                width: 100%
            }
        }

        /* ---------- BASE ---------- */
        .base {
            position: relative;
            height: clamp(10px, 1.8vw, 16px);
            width: 118%;
            margin-left: -9%;
            background: linear-gradient(#d8d9de, #a9aab1);
            border-radius: 0 0 22px 22px / 0 0 14px 14px;
            box-shadow: 0 18px 30px rgba(0, 0, 0, .25);
        }

        .base::before {
            /* thumb notch */
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 16%;
            height: 55%;
            transform: translateX(-50%);
            background: #8d8e95;
            border-radius: 0 0 10px 10px
        }

        @media (prefers-reduced-motion:reduce) {
            .stage {
                animation: none
            }

            .lid,
            .slide {
                transition: none
            }
        }
    </style>
</head>

<body>

    <div class="stage" id="stage">
        <div class="lid">
            <div class="screen" id="screen">
                <div class="dots" id="dots"></div>
                <div class="bar" id="bar"></div>
            </div>
        </div>
        <div class="base"></div>
    </div>

    <script>
        /* ===== EDIT YOUR SLIDES HERE ===== */
        const SLIDES = [
            "K_SL Customs Agentic AI Solutions x.png",
            "E_ Amana bank.png",
            "F_Allianz AIR project.png",
            "I_Green market for Ruwan Rekha and csiap.png"
        ];
        const INTERVAL = 7500; // ms per slide
        /* ================================== */

        const stage = document.getElementById('stage');
        const screen = document.getElementById('screen');
        const dotsBox = document.getElementById('dots');
        const bar = document.getElementById('bar');
        bar.style.setProperty('--dur', INTERVAL + 'ms');

        const slides = SLIDES.map((src, i) => {
            const d = document.createElement('div');
            d.className = 'slide';
            const img = new Image();
            img.src = src; img.alt = 'Screen ' + (i + 1);
            d.appendChild(img);
            screen.insertBefore(d, dotsBox);
            return d;
        });
        const dots = SLIDES.map((_, i) => {
            const b = document.createElement('button');
            b.setAttribute('aria-label', 'Slide ' + (i + 1));
            b.onclick = () => { go(i); restart(); };
            dotsBox.appendChild(b);
            return b;
        });

        let cur = 0, timer = null;
        function go(n) {
            cur = (n + slides.length) % slides.length;
            slides.forEach((s, i) => s.classList.toggle('active', i === cur));
            dots.forEach((d, i) => d.classList.toggle('active', i === cur));
            bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');
        }
        function start() { timer = setInterval(() => go(cur + 1), INTERVAL); }
        function stop() { clearInterval(timer); }
        function restart() { stop(); start(); }

        screen.addEventListener('mouseenter', () => { stop(); bar.style.animationPlayState = 'paused'; });
        screen.addEventListener('mouseleave', () => { bar.style.animationPlayState = 'running'; start(); });

        /* open the lid when scrolled into view, then start slideshow */
        new IntersectionObserver((entries, obs) => {
            if (entries[0].isIntersecting) {
                stage.classList.add('open');
                setTimeout(() => { go(0); start(); }, 900);
                obs.disconnect();
            }
        }, { threshold: .35 }).observe(stage);
    </script>
</body>

</html>
