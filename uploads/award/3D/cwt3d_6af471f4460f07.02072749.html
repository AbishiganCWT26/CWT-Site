<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Microsoft Glass Award Trophy v2</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background: transparent;
		}
		#hint {
			position: fixed;
			left: 12px;
			bottom: 10px;
			color: transparent;
			font: 12px system-ui, sans-serif;
			opacity: .7;
		}
	</style>
	<script type="importmap">
	{ "imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
		"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
	} }
	</script>
</head>
<body>
<div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const FONT = '"Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: false });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 50);
camera.position.set(-1.4, 1.5, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.minDistance = 2.5;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.enableZoom = false;

let zoomTarget = camera.position.distanceTo(controls.target);
const zoomOffset = new THREE.Vector3();
renderer.domElement.addEventListener('wheel', e => {
	e.preventDefault();
	zoomTarget = THREE.MathUtils.clamp(zoomTarget * Math.exp(e.deltaY * 0.0012), controls.minDistance, controls.maxDistance);
}, { passive: false });

scene.add(new THREE.HemisphereLight(0xe6ecff, 0x44507a, 0.8));

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 15 });
key.shadow.bias = -0.0005;
key.shadow.radius = 5;
scene.add(key);

const rim = new THREE.DirectionalLight(0xc8d8ff, 2.0);
rim.position.set(-4, 3, -3);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffffff, 1.0);
fill.position.set(-3, 1.5, 4);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.3 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const trophy = new THREE.Group();
scene.add(trophy);

const BASE_RX = 0.82, BASE_RY = 0.22, BASE_H = 0.3, BT = 0.03;
const HB = BASE_H - 0.05, TAPER = 0.1;

function makeBrushed() {
	const c = document.createElement('canvas'); c.width = 512; c.height = 512;
	const g = c.getContext('2d');
	g.fillStyle = '#b4b4b4'; g.fillRect(0, 0, 512, 512);
	for (let i = 0; i < 2500; i++) {
		const v = 150 + Math.random() * 90;
		g.fillStyle = `rgba(${v},${v},${v},0.35)`;
		g.fillRect(Math.random() * 512, Math.random() * 512, 40 + Math.random() * 200, 1);
	}
	const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

const EXP_X = 0.85, EXP_Y = 0.9;
function lozenge(rx, ry) {
	const sh = new THREE.Shape();
	for (let i = 0; i <= 96; i++) {
		const a = (i / 96) * Math.PI * 2, cs = Math.cos(a), sn = Math.sin(a);
		const x = rx * Math.sign(cs) * Math.pow(Math.abs(cs), EXP_X);
		const y = ry * Math.sign(sn) * Math.pow(Math.abs(sn), EXP_Y);
		i === 0 ? sh.moveTo(x, y) : sh.lineTo(x, y);
	}
	return sh;
}

const baseGeo = new THREE.ExtrudeGeometry(lozenge(BASE_RX - BT, BASE_RY - BT), {
	depth: HB - 2 * BT, bevelEnabled: true, bevelSize: BT, bevelThickness: BT, bevelSegments: 6
});
baseGeo.rotateX(-Math.PI / 2);
baseGeo.translate(0, BT, 0);
{
	const p = baseGeo.attributes.position;
	for (let i = 0; i < p.count; i++) {
		p.setZ(i, p.getZ(i) * (1 - TAPER * THREE.MathUtils.clamp(p.getY(i) / HB, 0, 1)));
	}
	baseGeo.computeVertexNormals();
}

const steel = new THREE.MeshStandardMaterial({
	color: 0xf4f5f7, metalness: 0.9, roughness: 0.55, roughnessMap: makeBrushed(), envMapIntensity: 1.8
});
const base = new THREE.Mesh(baseGeo, steel);
base.castShadow = base.receiveShadow = true;
trophy.add(base);

const chrome = new THREE.MeshStandardMaterial({ color: 0xf2f4f7, metalness: 1.0, roughness: 0.2, envMapIntensity: 2.0 });
const RB = 0.012, RIM_H = 0.07;
const rimGeo = new THREE.ExtrudeGeometry(lozenge(BASE_RX - 0.06 - RB, 0.165 - RB), {
	depth: RIM_H - 2 * RB, bevelEnabled: true, bevelSize: RB, bevelThickness: RB, bevelSegments: 4
});
rimGeo.rotateX(-Math.PI / 2);
rimGeo.translate(0, BASE_H - RIM_H + RB, 0);
const baseRim = new THREE.Mesh(rimGeo, chrome);
baseRim.castShadow = baseRim.receiveShadow = true;
trophy.add(baseRim);

const CAP_X0 = 0.38, CAP_LC = 0.36, CAP_HH = 0.08, CAP_YC = HB * 0.5;
const capOutline = (() => {
	const V = (a, b) => new THREE.Vector2(a, b);
	const cub = new THREE.CubicBezierCurve(V(0, 0), V(0.3, 1.1), V(0.85, 1.25), V(1, 0.55)).getPoints(24);
	const quad = new THREE.QuadraticBezierCurve(V(1, 0.55), V(1.06, 0), V(1, -0.55)).getPoints(16).slice(1, 9);
	return cub.concat(quad);
})();

function capGeo(sign, grow, off, skirt) {
	const M = 10, N = capOutline.length;
	const pos = [], idx = [];
	const surf = (a, y, o) => {
		const x = CAP_X0 + a * CAP_LC;
		const k = 1 - TAPER * y / HB;
		const u = Math.min(x / BASE_RX, 0.999);
		const c = Math.pow(u, 1 / EXP_X);
		const r = Math.sqrt(1 - c * c);
		const f = BASE_RY * Math.pow(r, EXP_Y) * k;
		const dc = Math.pow(u, 1 / EXP_X - 1) / (EXP_X * BASE_RX);
		const df = -BASE_RY * EXP_Y * Math.pow(r, EXP_Y - 2) * c * dc * k;
		const l = Math.hypot(df, 1);
		return [sign * (x - df / l * o), y, f + o / l];
	};
	const col = i => {
		const a = 0.52 + (capOutline[i].x - 0.52) * grow;
		const h = capOutline[i].y * CAP_HH * grow * (grow > 1 ? 1.15 : 1);
		return [a, h];
	};
	for (let i = 0; i < N; i++) {
		const [a, h] = col(i);
		for (let j = 0; j <= M; j++) pos.push(...surf(a, CAP_YC + (j / M * 2 - 1) * h, off));
	}
	const flip = sign < 0;
	const quad = (A, B, C, D) => flip ? idx.push(A, C, B, A, D, C) : idx.push(A, B, C, A, C, D);
	for (let i = 0; i < N - 1; i++) {
		for (let j = 0; j < M; j++) {
			const A = i * (M + 1) + j, B = (i + 1) * (M + 1) + j;
			quad(A, B, B + 1, A + 1);
		}
	}
	if (skirt) {
		[-1, 1].forEach(side => {
			const s0 = pos.length / 3;
			for (let i = 0; i < N; i++) {
				const [a, h] = col(i);
				const y = CAP_YC + side * h;
				pos.push(...surf(a, y, off), ...surf(a, y, off - 0.03));
			}
			for (let i = 0; i < N - 1; i++) {
				const A = s0 + i * 2, B = s0 + (i + 1) * 2;
				side > 0 ? quad(A, A + 1, B + 1, B) : quad(A, B, B + 1, A + 1);
			}
		});
	}
	const g = new THREE.BufferGeometry();
	g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
	g.setIndex(idx);
	g.computeVertexNormals();
	return g;
}

const capMat = new THREE.MeshStandardMaterial({
	color: 0xe3d4a8, metalness: 0.9, roughness: 0.32, envMapIntensity: 1.8, side: THREE.DoubleSide
});
const grooveMat = new THREE.MeshStandardMaterial({
	color: 0x3a3d42, metalness: 0.5, roughness: 0.6, side: THREE.DoubleSide
});
const capsFront = new THREE.Group();
[-1, 1].forEach(s => {
	const groove = new THREE.Mesh(capGeo(s, 1.06, 0.004, false), grooveMat);
	const cap = new THREE.Mesh(capGeo(s, 1, 0.014, true), capMat);
	cap.castShadow = true;
	capsFront.add(groove, cap);
});
trophy.add(capsFront);
const capsBack = capsFront.clone();
capsBack.rotation.y = Math.PI;
trophy.add(capsBack);

const W = 1.5, HW = W / 2, SHOULDER = 1.95, CTRL = 2.55, TAPER_Y = 0.32, BW = 0.52;
const T = 0.07, GB = 0.04, GBS = 0.06;
const shape = new THREE.Shape();
shape.moveTo(-BW, 0);
shape.lineTo(BW, 0);
shape.lineTo(HW, TAPER_Y);
shape.lineTo(HW, SHOULDER);
shape.quadraticCurveTo(0, CTRL, -HW, SHOULDER);
shape.lineTo(-HW, TAPER_Y);
shape.closePath();

const glassGeo = new THREE.ExtrudeGeometry(shape, {
	depth: T, curveSegments: 64,
	bevelEnabled: true, bevelSize: GBS, bevelThickness: GB, bevelSegments: 1
});
glassGeo.translate(0, 0, -T / 2);

const glassMat = new THREE.MeshPhysicalMaterial({
	color: 0xffffff,
	metalness: 0, roughness: 0.03,
	transmission: 1.0, thickness: 0.25, ior: 1.5,
	attenuationColor: new THREE.Color(0xcfe3ff), attenuationDistance: 4.0,
	specularIntensity: 1, clearcoat: 1, clearcoatRoughness: 0.02,
	envMapIntensity: 1.1
});
const glass = new THREE.Mesh(glassGeo, glassMat);
const GLASS_Y = BASE_H - 0.02;
glass.position.y = GLASS_Y;
trophy.add(glass);

const edges = new THREE.LineSegments(
	new THREE.EdgesGeometry(glassGeo, 25),
	new THREE.LineBasicMaterial({ color: 0xe4e9ff, transparent: true, opacity: 0.55 })
);
edges.position.y = GLASS_Y;
trophy.add(edges);

const slot = new THREE.Mesh(
	new THREE.BoxGeometry(1.24, 0.008, 0.18),
	new THREE.MeshStandardMaterial({ color: 0x8c9198, metalness: 1.0, roughness: 0.35 })
);
slot.position.y = BASE_H + 0.002;
trophy.add(slot);

[1, -1].forEach(s => {
	const rail = new THREE.Mesh(new THREE.BoxGeometry(1.24, 0.05, 0.024), chrome);
	rail.position.set(0, BASE_H + 0.022, s * (T / 2 + GB + 0.012));
	rail.castShadow = true;
	trophy.add(rail);
});

const PH = 2.4;

function makeEngraving() {
	const CW = 2048, CH = Math.round(CW * PH / W);
	const c = document.createElement('canvas'); c.width = CW; c.height = CH;
	const g = c.getContext('2d');
	const px = v => v * CW / W;
	const cy = y => CH - y * CH / PH;
	g.textBaseline = 'middle';

	function line(text, widthW, yW, { weight = 500, style = 'normal', xW = 0 } = {}) {
		g.font = `${style} ${weight} 100px ${FONT}`;
		const size = 100 * px(widthW) / g.measureText(text).width;
		g.font = `${style} ${weight} ${size}px ${FONT}`;
		g.textAlign = 'center';
		const x = CW / 2 + px(xW), y = cy(yW), o = size * 0.035;
		g.fillStyle = 'rgba(95,78,205,0.85)'; g.fillText(text, x + o, y + o);
		g.fillStyle = 'rgba(236,234,255,0.97)'; g.fillText(text, x, y);
		return size;
	}

	const ly = 1.58, sq = 0.114, gp = 0.008, gx0 = -0.36 - sq - gp / 2;
	[['#f25022', 0, 0], ['#7fba00', 1, 0], ['#00a4ef', 0, 1], ['#ffb900', 1, 1]].forEach(([col, i, j]) => {
		const x = CW / 2 + px(-0.52 + i * (sq + gp));
		const y = cy(ly + sq + gp / 2 - j * (sq + gp));
		g.fillStyle = 'rgba(95,78,205,0.7)'; g.fillRect(x + 3, y + 3, px(sq), px(sq));
		g.fillStyle = col; g.fillRect(x, y, px(sq), px(sq));
	});
	line('Microsoft', 0.76, ly, { weight: 600, xW: 0.14 });

	line('Special Recognition', 1.0, 1.19, { style: 'italic' });
	line('App Innovation for', 1.0, 0.88);
	line('Sri Lanka 2022', 0.58, 0.74);
	line('Creative Technology Solutions', 1.1, 0.44, { weight: 400 });
	line('(Pvt) Ltd', 0.3, 0.34, { weight: 400 });

	const tex = new THREE.CanvasTexture(c);
	tex.colorSpace = THREE.SRGBColorSpace;
	tex.anisotropy = 16;
	return tex;
}
const engravingTex = makeEngraving();
const engMat = new THREE.MeshBasicMaterial({
	map: engravingTex, transparent: true, depthWrite: false, side: THREE.DoubleSide, toneMapped: false
});
const FACE = T / 2 + GB + 0.003;
[1, -1].forEach(s => {
	const p = new THREE.Mesh(new THREE.PlaneGeometry(W, PH), engMat);
	p.position.set(0, GLASS_Y + PH / 2, s * FACE);
	p.renderOrder = 2;
	trophy.add(p);
});

addEventListener('resize', () => {
	camera.aspect = innerWidth / innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
	zoomOffset.copy(camera.position).sub(controls.target);
	const dist = zoomOffset.length();
	const next = dist + (zoomTarget - dist) * 0.12;
	zoomOffset.setLength(Math.abs(zoomTarget - next) < 0.0005 ? zoomTarget : next);
	camera.position.copy(controls.target).add(zoomOffset);
	controls.update();
	renderer.render(scene, camera);
});

// Scroll-based rotation: expose trophy group and listen for postMessage from parent
window.cwtAwardGroup = trophy;
window.cwtAwardRotate = function(angle) { trophy.rotation.y = angle; };
window.addEventListener('message', function(e) {
	if (e.data && e.data.type === 'cwt-award-rotate') {
		trophy.rotation.y = e.data.angle;
	}
});
</script>
</body>
</html>
